[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "qubettera"
version = "0.1.0"
description = "Retrieval-grounded multi-agent architecture discussions"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "crawl4ai",
  "ddgs",
  "emoji>=2,<3",
  "jinja2",
  "jsonschema>=4",
  "langchain",
  "langchain-community",
  "langchain-core",
  "langchain-groq",
  "langchain-ollama",
  "langchain-openai",
  "langchain-openrouter",
  "langchain-text-splitters>=1,<2",
  "langfuse",
  "langgraph",
  "langgraph-checkpoint-postgres",
  "numpy>=1.26,<3",
  "playwright",
  "psycopg2-binary>=2.9,<3",
  "PyMuPDF>=1.26,<2",
  "python-dotenv>=1,<2",
  "requests",
  "scrapling[fetchers,rag]>=0.4,<0.5",
  "sentence-transformers>=5,<7",
  "tavily-python",
  "typing-extensions",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio"]

[project.scripts]
qubettera = "qubettera.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

